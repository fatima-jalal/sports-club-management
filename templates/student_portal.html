<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Portal - Sports Club Management System</title>
 <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="brand">Sports<span>Club</span> Portal</div>
    <nav>
  <a href="/student">Student Portal</a>
  <a href="/admin">Admin Workspace</a>
</nav>
  </header>

  <section class="hero">
    <h1>Welcome back, Fatima</h1>
    <p>Browse available clubs, check timing windows, and register below.</p>
  </section>

  <section class="section">
    <h2>Available Clubs</h2>
    <div class="club-grid" id="club-grid">
      <!-- Club cards are inserted here automatically by app.js -->
    </div>
  </section>

  <section class="section">
    <h2>Register for a Club</h2>
    <div class="form-card">
      <form id="registration-form">
       <div class="form-group">
  <label for="member-id">Your Member ID</label>
  <input type="number" id="member-id" placeholder="e.g. 1" required>
</div>
        <div class="form-group">
          <label for="club-select">Select a Club</label>
          <select id="club-select" required>
            <option value="" disabled selected>Choose a club</option>
            <!-- Club options are inserted here automatically by app.js -->
          </select>
        </div>
        <div class="form-group">
          <label for="join-date">Preferred Join Date</label>
          <input type="date" id="join-date" required>
        </div>
        <button type="submit" class="btn">Submit Registration</button>
      </form>
    </div>
  </section>

  <script src="/static/js/app.js"></script>
</body>
</html>
